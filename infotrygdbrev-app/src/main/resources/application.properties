spring.application.name=dokprod-infotrygdbrev
spring.main.banner-mode=off

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
logging.level.org.hibernate.orm.connections.pooling=warn

dokprod.infotrygdbrev.jms.hostname=${MQGATEWAY01_HOSTNAME}
dokprod.infotrygdbrev.jms.port=${MQGATEWAY01_PORT}
dokprod.infotrygdbrev.jms.queue-manager=${MQGATEWAY01_NAME}
dokprod.infotrygdbrev.jms.channel=${MQGATEWAY01_CHANNEL_SECURENAME}
dokprod.infotrygdbrev.jms.queue-name=${DOKPROD_INFOTRYGDBREV_QDOK001_QUEUENAME}

# Expose health (with liveness/readiness groups) and prometheus over HTTP for NAIS probes/scraping
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
