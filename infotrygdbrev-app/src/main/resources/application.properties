spring.application.name=dokprod-infotrygdbrev
spring.main.banner-mode=off
spring.jpa.open-in-view=false

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
logging.level.org.hibernate.orm.connections.pooling=warn

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# Relative SFTP directories are resolved from the account's login directory.
dokprod.infotrygdbrev.sftp.remote-input-directory=inbound
dokprod.infotrygdbrev.sftp.remote-output-directory=outbound
dokprod.infotrygdbrev.sftp.timeout=30s
spring.datasource.url=${READWRITE_PGJDBCURL}
spring.flyway.url=${PGJDBCURL}
